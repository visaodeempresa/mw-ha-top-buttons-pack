<!doctype html>
<meta charset="utf-8">
<title>MW Top Buttons Pack — bancada</title>
<!--
  Bancada offline: carrega o pacote de verdade (dist/…js) com um `hass` de
  mentira e dublês de <ha-card>/<ha-icon>. Serve para ver o desenho sem
  depender do HA — NÃO substitui a conferência no HA de verdade.
    python3 -m http.server -d . 8099   →   http://localhost:8099/docs/preview.html
-->
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 28px; font: 14px/1.4 -apple-system, system-ui, sans-serif;
         background: #d9d5cc; color: #1a1a1a; }
  body.noite { background: #14120f; color: #f2efe7; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
       opacity: .55; margin: 26px 0 10px; }
  .fila { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
          gap: 14px; max-width: 1180px; }
  .cap { font-size: 11px; opacity: .55; text-align: center; margin-top: 6px; }
  .bt { position: fixed; top: 14px; right: 16px; z-index: 9; padding: 8px 14px; border-radius: 10px;
        border: 1px solid rgba(128,128,128,.4); background: rgba(128,128,128,.15);
        color: inherit; font: inherit; cursor: pointer; }
</style>
<button class="bt" onclick="virar()">papel de noite / de dia</button>
<script>
  /* modo galeria: é assim que as imagens do README são geradas, para elas
     nunca discordarem do código que está no repositório.
       ?galeria=1  esconde o botão e aperta as margens
       ?noite=1    começa no papel de noite
       ?cols=7     trava o número de colunas                                */
  const Q = new URLSearchParams(location.search);
  if (Q.has("galeria")) document.write(
    "<style>.bt{display:none}body{padding:18px 20px 8px}h2{margin:18px 0 8px}</style>");
  if (Q.get("cols")) document.write(
    `<style>.fila{grid-template-columns:repeat(${+Q.get("cols")},1fr)!important;max-width:none}</style>`);
</script>
<div id="tela"></div>

<script type="module">
import * as mdi from "https://esm.sh/@mdi/js@7.4.47";

/* dublês: o pacote só depende de <ha-card> (a caixa) e <ha-icon> (o desenho) */
class HaCard extends HTMLElement {
  connectedCallback() {
    if (this.shadowRoot) return;
    this.attachShadow({ mode: "open" }).innerHTML =
      `<style>:host{display:block;height:100%}</style><slot></slot>`;
  }
}
customElements.define("ha-card", HaCard);

const nome = (i) => "mdi" + String(i || "").replace(/^mdi:/, "")
  .replace(/(^|-)([a-z0-9])/g, (_, __, c) => c.toUpperCase());
class HaIcon extends HTMLElement {
  static get observedAttributes() { return ["icon"]; }
  attributeChangedCallback() { this.pinta(); }
  connectedCallback() { this.pinta(); }
  pinta() {
    const d = mdi[nome(this.getAttribute("icon"))] || mdi.mdiHelpRhombusOutline;
    if (!this.shadowRoot) this.attachShadow({ mode: "open" });
    this.shadowRoot.innerHTML =
      `<style>:host{display:block}svg{width:100%;height:100%;display:block}</style>
       <svg viewBox="0 0 24 24"><path fill="currentColor" d="${d}"></path></svg>`;
  }
}
customElements.define("ha-icon", HaIcon);

/* estados de mentira, escolhidos para mostrar a rampa inteira */
const st = (s, u, dc, n) => ({ state: String(s), attributes: { unit_of_measurement: u, device_class: dc, friendly_name: n } });
const hass = {
  locale: { language: "pt-BR" },
  themes: { darkMode: new URLSearchParams(location.search).has("noite") },
  states: {
    "sensor.varanda_temperatura": st(8.2, "°C", "temperature", "Varanda"),
    "sensor.sala_temperatura": st(23.4, "°C", "temperature", "Sala"),
    "sensor.sotao_temperatura": st(34.1, "°C", "temperature", "Sótão"),
    "sensor.sala_umidade": st(58, "%", "humidity", "Sala"),
    "sensor.escritorio_umidade": st(28, "%", "humidity", "Escritório"),
    "sensor.corredor_luminosidade": st(742, "lx", "illuminance", "Sala"),
    "sensor.sala_co2": st(520, "ppm", "carbon_dioxide", "Sala"),

    "sensor.casa_qualidade_do_ar": st(72, "AQI", "aqi", "Casa"),

    "sensor.chuveiro_potencia": st(1.2, "kW", "power", "Chuveiro"),
    "sensor.casa_consumo": st(12.34, "kWh", "energy", "Casa"),
    "sensor.porta_sensor_bateria": st(14, "%", "battery", "Sensor da porta"),
    "sensor.sala_ruido": st(58, "dB", "sound_pressure", "Sala"),
    "sensor.sensor_caido": st("unavailable", "°C", "temperature", "Sensor caído"),
    "binary_sensor.porta_da_sala": st("on", null, "door", "Porta da sala"),
    "binary_sensor.janela_da_sala": st("off", null, "window", "Janela"),
    "binary_sensor.escritorio_ocupacao": st("on", null, "occupancy", "Escritório"),
    "binary_sensor.corredor_movimento": st("off", null, "motion", "Corredor"),
    "sensor.quarto_luminosidade": st(2, "lx", "illuminance", "Quarto no breu"),
    "sensor.sala_luminosidade": st(120, "lx", "illuminance", "Sala à noite"),
    "sensor.varanda_luminosidade": st(1800, "lx", "illuminance", "Varanda ao sol"),
    "sensor.purificador_qualidade_do_ar": st("great", null, null, "Purificador"),
    "sensor.escritorio_cov": st(0.4, "ppm", null, "COV do escritório"),
    "sensor.freezer_temperatura": st(2.0, "°C", "temperature", "Freezer"),
    "sensor.banheiro_umidade": st(82, "%", "humidity", "Banheiro"),
  },
  entities: {}, devices: {}, areas: {},
  callService(...a) { console.log("callService", a); },
};

const FILAS = [
  ["a mesma grandeza, três leituras — o papel É a leitura", [
    ["mw-top-temperature-card", { entity: "sensor.varanda_temperatura", show_label: true }, "8,2 °C"],
    ["mw-top-temperature-card", { entity: "sensor.sala_temperatura", show_label: true }, "23,4 °C"],
    ["mw-top-temperature-card", { entity: "sensor.sotao_temperatura", show_label: true }, "34,1 °C"],
    ["mw-top-humidity-card", { entity: "sensor.escritorio_umidade", show_label: true }, "28 %"],
    ["mw-top-humidity-card", { entity: "sensor.sala_umidade", show_label: true }, "58 %"],
    ["mw-top-co2-card", { entity: "sensor.sala_co2", show_label: true }, "520 ppm"],
    ["mw-top-co2-card", { entity: "sensor.quarto_co2", show_label: true }, "1240 ppm"],
  ]],
  ["o fundo é o estado E a intensidade dele — luminosidade acende o papel", [
    ["mw-top-illuminance-card", { entity: "sensor.quarto_luminosidade", show_label: true }, "2 lx"],
    ["mw-top-illuminance-card", { entity: "sensor.sala_luminosidade", show_label: true }, "120 lx"],
    ["mw-top-illuminance-card", { entity: "sensor.varanda_luminosidade", show_label: true }, "1800 lx"],
    ["mw-top-battery-card", { entity: "sensor.porta_sensor_bateria", show_label: true }, "bateria 14 %"],
    ["mw-top-door-window-card", { entity: "binary_sensor.porta_da_sala", show_value: true }, "aberta = verde"],
    ["mw-top-door-window-card", { entity: "binary_sensor.janela_da_sala", show_value: true }, "fechada = vermelho"],
    ["mw-top-temperature-card", { entity: "sensor.sensor_caido", show_label: true }, "indisponível"],
  ]],
  ["temperatura e umidade: o papel É a escala canônica da casa", [
    ["mw-top-temperature-card", { entity: "sensor.freezer_temperatura", show_label: true }, "2 °C"],
    ["mw-top-temperature-card", { entity: "sensor.varanda_temperatura", show_label: true }, "8,2 °C"],
    ["mw-top-temperature-card", { entity: "sensor.sala_temperatura", show_label: true }, "23,4 °C"],
    ["mw-top-temperature-card", { entity: "sensor.sotao_temperatura", show_label: true }, "34,1 °C"],
    ["mw-top-humidity-card", { entity: "sensor.escritorio_umidade", show_label: true }, "28 %"],
    ["mw-top-humidity-card", { entity: "sensor.sala_umidade", show_label: true }, "58 %"],
    ["mw-top-humidity-card", { entity: "sensor.banheiro_umidade", show_label: true }, "82 %"],
  ]],
  ["os cinco degraus de papel (o mesmo CO₂ de 1240 ppm)", [
    ["mw-top-co2-card", { entity: "sensor.quarto_co2", paper_theme: "claro" }, "claro"],
    ["mw-top-co2-card", { entity: "sensor.quarto_co2", paper_theme: "claro-medio" }, "claro-médio"],
    ["mw-top-co2-card", { entity: "sensor.quarto_co2", paper_theme: "medio" }, "médio"],
    ["mw-top-co2-card", { entity: "sensor.quarto_co2", paper_theme: "escuro-medio" }, "escuro-médio"],
    ["mw-top-co2-card", { entity: "sensor.quarto_co2", paper_theme: "escuro" }, "escuro"],
    ["mw-top-aqi-card", { entity: "sensor.purificador_qualidade_do_ar", show_label: true }, "estado por texto"],
    ["mw-top-voc-card", { entity: "sensor.escritorio_cov", show_label: true }, "COV em ppm"],
  ]],
  ["o pacote inteiro (quadrado de cantos arredondados)", [
    ["mw-top-temperature-card", { entity: "sensor.sala_temperatura" }, "temperatura"],
    ["mw-top-humidity-card", { entity: "sensor.sala_umidade" }, "umidade"],
    ["mw-top-door-window-card", { entity: "binary_sensor.porta_da_sala" }, "porta aberta"],
    ["mw-top-door-window-card", { entity: "binary_sensor.janela_da_sala" }, "janela fechada"],
    ["mw-top-occupancy-card", { entity: "binary_sensor.escritorio_ocupacao" }, "ocupado"],
    ["mw-top-motion-card", { entity: "binary_sensor.corredor_movimento" }, "sem movimento"],
    ["mw-top-illuminance-card", { entity: "sensor.corredor_luminosidade" }, "luminosidade"],
    ["mw-top-power-card", { entities: ["sensor.tomada_rack_potencia", "sensor.chuveiro_potencia"] }, "potência (soma)"],
    ["mw-top-energy-card", { entity: "sensor.casa_consumo" }, "consumo"],
    ["mw-top-co2-card", { entity: "sensor.quarto_co2" }, "CO₂"],
    ["mw-top-formaldehyde-card", { entity: "sensor.sala_formaldeido" }, "formaldeído"],
    ["mw-top-voc-card", { entity: "sensor.sala_cov" }, "COV"],
    ["mw-top-pm25-card", { entity: "sensor.sala_pm25" }, "PM2.5"],
    ["mw-top-pm10-card", { entity: "sensor.sala_pm10" }, "PM10"],
    ["mw-top-aqi-card", { entity: "sensor.casa_qualidade_do_ar" }, "qualidade do ar"],
    ["mw-top-battery-card", { entity: "sensor.porta_sensor_bateria" }, "bateria"],
    ["mw-top-noise-card", { entity: "sensor.sala_ruido" }, "ruído"],
    ["mw-top-temperature-card", { entity: "sensor.sensor_caido" }, "sensor caído"],
  ]],
  ["círculo, com rótulo", [
    ["mw-top-temperature-card", { entity: "sensor.sala_temperatura", shape: "circle", show_label: true }, "temperatura"],
    ["mw-top-humidity-card", { entity: "sensor.sala_umidade", shape: "circle", show_label: true }, "umidade"],
    ["mw-top-co2-card", { entity: "sensor.quarto_co2", shape: "circle", show_label: true }, "CO₂"],
    ["mw-top-power-card", { entities: ["sensor.tomada_rack_potencia", "sensor.chuveiro_potencia"], shape: "circle", show_label: true, name: "Sala" }, "soma"],
    ["mw-top-occupancy-card", { entity: "binary_sensor.escritorio_ocupacao", shape: "circle", show_label: true }, "ocupação"],
    ["mw-top-battery-card", { entity: "sensor.porta_sensor_bateria", shape: "circle", show_label: true }, "bateria"],
  ]],
  ["os três níveis de 3D · e só o ícone", [
    ["mw-top-co2-card", { entity: "sensor.quarto_co2", quality: "alta" }, "alta"],
    ["mw-top-co2-card", { entity: "sensor.quarto_co2", quality: "equilibrada" }, "equilibrada"],
    ["mw-top-co2-card", { entity: "sensor.quarto_co2", quality: "plana" }, "plana"],
    ["mw-top-temperature-card", { entity: "sensor.sotao_temperatura", show_value: false }, "só ícone"],
    ["mw-top-door-window-card", { entity: "binary_sensor.porta_da_sala", shape: "circle" }, "só ícone"],
    ["mw-top-humidity-card", { entity: "sensor.sala_umidade", show_icon: false }, "só número"],
    ["mw-top-temperature-card", { entity: "sensor.sala_temperatura", show_ring: false }, "sem anel"],
    ["mw-top-temperature-card", { entity: "sensor.sala_temperatura", paper_mode: "fixo", paper_color: "violet-3" }, "papel fixo"],
  ]],
];

const tela = document.getElementById("tela");
function desenha() {
  tela.innerHTML = "";
  for (const [titulo, itens] of FILAS) {
    const h = document.createElement("h2"); h.textContent = titulo; tela.appendChild(h);
    const fila = document.createElement("div"); fila.className = "fila"; tela.appendChild(fila);
    for (const [tag, cfg, cap] of itens) {
      const cel = document.createElement("div");
      const el = document.createElement(tag);
      el.setConfig({ type: `custom:${tag}`, ...cfg });
      el.hass = hass;
      cel.appendChild(el);
      const c = document.createElement("div"); c.className = "cap"; c.textContent = cap;
      cel.appendChild(c);
      fila.appendChild(cel);
    }
  }
}
window.virar = () => {
  hass.themes.darkMode = !hass.themes.darkMode;
  document.body.classList.toggle("noite", hass.themes.darkMode);
  desenha();
};

/* o pacote é um IIFE clássico: entra por <script>, não por import */
const s = document.createElement("script");
s.src = "../dist/mw-top-buttons-pack.js";
s.onload = () => {
  if (hass.themes.darkMode) document.body.classList.add("noite");
  desenha();
};
document.head.appendChild(s);
</script>
